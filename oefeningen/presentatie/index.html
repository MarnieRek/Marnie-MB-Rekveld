# Zoek 50 afbeeldingen

Waarom kies je specifiek voor deze verzameling? Zijn er patronen te ontdekken? Heeft
alles een specifieke kleurstelling? Herken je een actie, een gevoel, een materiaal of
een standpunt? Wat is kenmerkend voor deze verzameling? Welke dingen komen steeds terug?

Ik heb voor deze foto's gekozen omdat dit de visie is die ik heb in mijn hoofd en ze samen wil brengen om één geheel te maken. 
Veel foto's krijg ik al op mijn Pinterest feed dus heb ik daar veel op gezocht, het is namelijk al gepersonaliseerd.
De meest voorkomende patronen zijn dan ook gek genoeg patronen en de kleuren; kobalt blauw en licht groen.
Deze foto's vind ik persoonlijk geruststellend vanwege het gebrek aan mensen.
